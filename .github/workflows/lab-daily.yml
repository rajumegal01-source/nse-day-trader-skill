# Trading Lab learns every trading day after the close (16:30 IST = 11:00 UTC), for free on GitHub.
# It grades today's triggers, retires settings that keep losing live, re-tests all Nifty 100
# stocks with the new day included, and commits lab/memory.json. No broker, no orders.
name: lab-daily
on:
  schedule:
    - cron: "0 11 * * 1-5"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  learn:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Learn and re-test
        run: python3 lab/lab.py daily
      - name: Save memory
        run: |
          git config user.name "trading-lab-bot"
          git config user.email "trading-lab-bot@users.noreply.github.com"
          git add lab/memory.json
          git diff --cached --quiet || git commit -m "lab: daily learning $(date -u +%F)"
          git push
