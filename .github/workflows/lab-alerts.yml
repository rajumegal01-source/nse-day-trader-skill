# Telegram alerts for new Trading Lab triggers, every 15 minutes in market hours
# (09:15-15:30 IST = 03:45-10:00 UTC, weekdays). GitHub may start a scheduled run a few minutes late.
# Needs the repo secret TELEGRAM_TOKEN (see lab/alert.py). No broker, no orders.
name: lab-alerts
on:
  schedule:
    - cron: "*/15 4-9 * * 1-5"
    - cron: "45 3 * * 1-5"
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: lab/alert_state.json
          key: alert-state-${{ github.run_id }}
          restore-keys: alert-state-
      - name: Send new triggers
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 lab/alert.py
